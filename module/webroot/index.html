<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fffbff">
    <title>NoMount</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" type="module"></script>
</head>
<body class="loading">
    <div class="root_layout">
        <div class="top-app-bar" id="top-app-bar" aria-hidden="true">
            <div class="top-app-bar-title" id="top-app-bar-title"></div>
        </div>

        <div class="page-container">
            <div class="pull-to-refresh-indicator">
                <md-icon>refresh</md-icon>
            </div>
            <div id="view-home" class="view-content active">
                <div class="header-title">NoMount</div>
                <div class="home-status-card">
                    <md-icon id="status-icon" class="status-icon">check_circle</md-icon>
                    <div class="status-text-col">
                        <div class="status-title-row">
                            <h2 id="status-title">检查中...</h2>
                            <span id="nm-mode-badge" class="mode-badge"></span>
                        </div>
                        <div id="status-indicator" class="status-label">检查中...</div>
                    </div>
                </div>

                <div class="home-segment-group">
                    <div class="home-segment-row">
                        <div class="segment-icon"><md-icon>account_tree</md-icon></div>
                        <div class="info-data">
                            <span class="info-label">状态</span>
                            <span class="info-value" id="injection-stats">计算中...</span>
                        </div>
                    </div>
                </div>

                <div class="segment-section-label">设备</div>
                <div class="home-segment-group">
                    <div class="home-segment-row">
                        <div class="segment-icon"><md-icon>smartphone</md-icon></div>
                        <div class="info-data">
                            <span class="info-label">机型</span>
                            <span class="info-value" id="device-model">加载中...</span>
                        </div>
                    </div>

                    <div class="home-segment-row">
                        <div class="segment-icon"><md-icon>settings_suggest</md-icon></div>
                        <div class="info-data">
                            <span class="info-label">系统</span>
                            <span class="info-value" id="android-ver">加载中...</span>
                        </div>
                    </div>

                    <div class="home-segment-row">
                        <div class="segment-icon">
                            <md-icon>memory</md-icon>
                        </div>
                        <div class="info-data">
                            <span class="info-label">内核</span>
                            <span class="info-value" id="kernel-version">加载中...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="view-modules" class="view-content">
                <div class="header-title">模块</div>
                <div id="modules-list" class="list"></div>
            </div>

            <div id="view-exclusions" class="view-content">
                <div class="header-title">排除</div>
                <div id="exclusions-list" class="list"></div>
            </div>

            <div id="view-options" class="view-content">
                <div class="header-title">设置</div>
                
                <div class="settings-segment-group">
                    <div class="segment-card setting-item">
                        <div class="setting-text">
                            <h3>安全模式</h3>
                            <p>下次开机后禁用所有注入</p>
                        </div>
                        <label class="custom-switch" id="setting-safemode">
                            <input type="checkbox" class="switch-input" aria-label="Safe Mode">
                            <span class="switch-track">
                                <span class="switch-thumb"></span>
                            </span>
                        </label>
                    </div>
                </div>

                <button class="custom-tonal-btn error" id="btn-clear-rules">
                    清除所有规则
                </button>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" data-target="view-home">
                <div class="nav-icon"><md-icon>home</md-icon></div>
                <span>主页</span>
            </div>
            <div class="nav-item" data-target="view-modules">
                <div class="nav-icon"><md-icon>extension</md-icon></div>
                <span>模块</span>
            </div>
            <div class="nav-item" data-target="view-exclusions">
                <div class="nav-icon"><md-icon>shield</md-icon></div>
                <span>排除</span>
            </div>
            <div class="nav-item" data-target="view-options">
                <div class="nav-icon"><md-icon>settings</md-icon></div>
                <span>设置</span>
            </div>
    </div>

    <div id="fab-container">
        <button class="custom-fab" id="fab-add-exclusion" aria-label="Add exclusion">
            <md-icon>add</md-icon>
        </button>
    </div>

    <div id="uid-input-modal" class="modal-overlay">
        <div class="md-dialog">
            <h3 class="md-dialog-title">手动输入 UID</h3>
            <div>
                <div class="md-text-field">
                    <input type="number" id="manual-uid-input" placeholder="e.g. 10123">
                </div>
            </div>
            <div class="md-dialog-actions">
                <button class="btn-text" id="btn-cancel-uid">取消</button>
                <button class="btn-text" id="btn-confirm-uid">添加</button>
            </div>
        </div>
    </div>

    <div id="app-selector-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择应用</h3>
                <md-icon-button id="btn-close-modal">
                    <md-icon>close</md-icon>
                </md-icon-button>
            </div>

            <div class="search-box">
                <md-icon>search</md-icon>
                <input id="app-search-input" placeholder="搜索应用名或包名...">
                <md-icon-button id="btn-filter-toggle">
                    <md-icon>filter_list</md-icon>
                </md-icon-button>
            </div>

            <div id="filter-menu" class="filter-menu">
                <div class="filter-option">
                    <span>显示系统应用</span>
                    <label class="custom-switch" id="switch-system-apps">
                        <input type="checkbox" class="switch-input" aria-label="Show System Apps">
                        <span class="switch-track">
                            <span class="switch-thumb"></span>
                        </span>
                    </label>
                </div>
            </div>

            <div class="app-list-wrapper">
                <button class="custom-fab modal-fab" id="modal-fab-action" aria-label="Manual UID/Batch Add">
                    <md-icon>edit</md-icon>
                </button>
                <div id="app-modal-refresh-indicator" class="pull-to-refresh-indicator">
                    <md-icon>refresh</md-icon>
                </div>
                <div id="app-list-container" class="app-list">
                    <div class="loading-spinner">加载应用列表中...</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
